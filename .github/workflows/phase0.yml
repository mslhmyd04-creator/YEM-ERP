name: Phase 0 checks

on:
  push:
    branches: [feat/phase-0-foundation]
  pull_request:

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration constraints
        run: python -m unittest discover -s tools -p 'check_*.py' -v

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android and Windows runners
        run: flutter create --platforms=android,windows --project-name yem_erp .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze sources
        run: flutter analyze
      - name: Run Flutter unit tests
        run: flutter test
      - name: Build Android debug app
        run: flutter build apk --debug
